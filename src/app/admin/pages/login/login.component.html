<div class="login-page">
  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <img src="logo.png" alt="Edge Customs" class="logo-img">
      <h1 class="logo-title">Edge Customs</h1>
      <p class="logo-sub">Admin Panel</p>
    </div>

    <!-- Role Selection -->
    <div class="role-selector">
      <button class="role-btn" [class.active]="selectedRole === 'admin'" (click)="selectRole('admin')">
        <span class="role-icon">🔑</span>
        <span class="role-name">Admin</span>
      </button>
      <button class="role-btn" [class.active]="selectedRole === 'staff'" (click)="selectRole('staff')">
        <span class="role-icon">👤</span>
        <span class="role-name">Staff</span>
      </button>
    </div>

    <!-- PIN Display -->
    <div class="pin-display">
      <div class="pin-dots">
        @for (i of [0,1,2,3]; track i) {
          <div class="pin-dot" [class.filled]="pin.length > i" [class.error]="error"></div>
        }
      </div>
      @if (error) {
        <p class="pin-error">{{ error }}</p>
      }
    </div>

    <!-- Number Pad -->
    <div class="numpad" [class.loading]="isLoading">
      @for (num of ['1','2','3','4','5','6','7','8','9','','0','del']; track num) {
        @if (num === '') {
          <div class="numpad-spacer"></div>
        } @else if (num === 'del') {
          <button class="numpad-btn delete" (click)="deleteDigit()">
            ⌫
          </button>
        } @else {
          <button class="numpad-btn" (click)="addDigit(num)">{{ num }}</button>
        }
      }
    </div>
  </div>
</div>
