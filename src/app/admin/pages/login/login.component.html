<div class="login-page">
  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <img src="logo.png" alt="Edge Customs" class="logo-img">
      <h1 class="logo-title">Edge Customs</h1>
      <p class="logo-sub">Admin Panel</p>
    </div>

    <!-- Role Selection -->
    <div class="role-selector">
      <button class="role-btn" [class.active]="selectedRole === 'admin'" (click)="selectRole('admin')">
        <span class="role-icon">🔑</span>
        <span class="role-name">Admin</span>
      </button>
      <button class="role-btn" [class.active]="selectedRole === 'staff'" (click)="selectRole('staff')">
        <span class="role-icon">👤</span>
        <span class="role-name">Staff</span>
      </button>
    </div>

    <!-- Secret Key Input -->
    <div class="login-form">
      <div class="input-group" [class.error]="error">
        <input type="password" [(ngModel)]="pin" placeholder="Enter password" class="key-input"
          [disabled]="isLoading" (keyup.enter)="login()">
        <span class="input-icon">🔒</span>
      </div>

      @if (error) {
      <p class="login-error">{{ error }}</p>
      }

      <button class="login-btn" [class.loading]="isLoading" [disabled]="isLoading || !pin"
        (click)="login()">
        @if (isLoading) {
        <span class="spinner"></span>
        } @else {
        Login to Portal
        }
      </button>
    </div>
  </div>
</div>
